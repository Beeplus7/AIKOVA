# AiKOVA — place in /etc/nginx/sites-available/aikova then symlink sites-enabled

upstream aikova_crm_api {
    server 127.0.0.1:3015;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name aikova.co.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aikova.co.uk;

    ssl_certificate /etc/letsencrypt/live/aikova.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aikova.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;
    root /var/www/aikova/web;
    index index.html;

    location /health {
        proxy_pass http://aikova_crm_api/health;
        proxy_http_version 1.1;
    }

    location = /actions {
        proxy_pass http://aikova_crm_api/actions;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
    }

    location /api/ {
        proxy_pass http://aikova_crm_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
