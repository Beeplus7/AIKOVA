# AiKOVA — place in /etc/nginx/sites-available/aikova then symlink sites-enabled

upstream aikova_crm_api {
    server 127.0.0.1:3015;
    keepalive 16;
}

# AI platforms + crawlers + common HTTP clients that fetch HTML without executing SPA JS.
# Humans with browser UAs still get the interactive Expo shell / artefacts.
map $http_user_agent $aikova_static_bot {
    default 0;
    "" 1;
    ~*(?i)(GPTBot|ChatGPT|OAI-SearchBot|ClaudeBot|anthropic|Claude-Web|Google-Extended|Googlebot|GoogleOther|bingbot|BingPreview|Bytespider|CCBot|Diffbot|FacebookExternalHit|Twitterbot|Slackbot|LinkedInBot|LinkedInApp|LinkedInBot|Discordbot|Applebot|Applebot-Extended|Perplexity|Amazonbot|DuckAssist|meta-externalagent|cohere-ai|YouBot|Neeva|Phind|iAsk|AndiBot|omgili|SemrushBot|AhrefsBot|DotBot|PetalBot|Yandex|Baiduspider|DuckDuckBot|ia_archiver|archive\.org) 1;
    ~*(?i)(curl|wget|python-requests|python-urllib|httpx|aiohttp|Go-http-client|Java/|okhttp|axios|node-fetch|undici|libwww|Scrapy|Mechanize|HeadlessChrome|PhantomJS|Selenium|Playwright|puppeteer) 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name aikova.co.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aikova.co.uk;

    ssl_certificate /etc/letsencrypt/live/aikova.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aikova.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;
    root /var/www/aikova/web;
    index index.html;

    # Help AI indexes discover machine-readable summary
    add_header X-Robots-Tag "index, follow, max-image-preview:large" always;
    add_header Link "</llms.txt>; rel=\"describedby\"; type=\"text/plain\", </aikova-ai-readable.html>; rel=\"alternate\"; type=\"text/html\"" always;

    location /health {
        proxy_pass http://aikova_crm_api/health;
        proxy_http_version 1.1;
    }

    location = /actions {
        proxy_pass http://aikova_crm_api/actions;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
    }

    location = /auth/google {
        proxy_pass http://aikova_crm_api/auth/google;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Content-Type $http_content_type;
    }

    location /auth/admins {
        proxy_pass http://aikova_crm_api/auth/admins;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
    }

    location = /auth/claim-admin {
        proxy_pass http://aikova_crm_api/auth/claim-admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Content-Type $http_content_type;
    }

    location /api/ {
        proxy_pass http://aikova_crm_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # Explicit machine / AI surfaces
    location = /llms.txt {
        try_files /llms.txt =404;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*" always;
    }
    location = /.well-known/llms.txt {
        try_files /llms.txt =404;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*" always;
    }
    location = /aikova-ai-readable.html {
        try_files /aikova-ai-readable.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Marketing deep links: bots get no-JS readable HTML; humans get interactive artefacts.
    location = / {
        if ($aikova_static_bot = 1) {
            rewrite ^ /aikova-ai-readable.html last;
        }
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /portfolio {
        try_files /portfolio-os/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /portfolio/ {
        try_files /portfolio-os/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /services {
        if ($aikova_static_bot = 1) {
            rewrite ^ /aikova-static-services.html last;
        }
        try_files /aikova-comprehensive-services.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /solutions {
        try_files /solutions-playbook/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /industries {
        try_files /industries-serve/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /contact {
        if ($aikova_static_bot = 1) {
            rewrite ^ /aikova-static-contact.html last;
        }
        try_files /aikova-ai-receptionist-contact.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Artefacts + SPA shell must not stick in browser/CDN cache after deploys
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
