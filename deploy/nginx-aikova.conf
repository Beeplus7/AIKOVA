# AiKOVA — place in /etc/nginx/sites-available/aikova then symlink sites-enabled

upstream aikova_crm_api {
    server 127.0.0.1:3015;
    keepalive 16;
}

# LLM / crawler UAs that often fetch HTML without executing SPA JS or iframes
map $http_user_agent $aikova_static_bot {
    default 0;
    ~*(?i)(GPTBot|ChatGPT|ClaudeBot|anthropic|Google-Extended|Googlebot|bingbot|Bytespider|CCBot|FacebookExternalHit|Twitterbot|Slackbot|LinkedInBot|Discordbot|Applebot|Perplexity|meta-externalagent|OAI-SearchBot) 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name aikova.co.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aikova.co.uk;

    ssl_certificate /etc/letsencrypt/live/aikova.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aikova.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;
    root /var/www/aikova/web;
    index index.html;

    location /health {
        proxy_pass http://aikova_crm_api/health;
        proxy_http_version 1.1;
    }

    location = /actions {
        proxy_pass http://aikova_crm_api/actions;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
    }

    location = /auth/google {
        proxy_pass http://aikova_crm_api/auth/google;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Content-Type $http_content_type;
    }

    location /auth/admins {
        proxy_pass http://aikova_crm_api/auth/admins;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
    }

    location = /auth/claim-admin {
        proxy_pass http://aikova_crm_api/auth/claim-admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Content-Type $http_content_type;
    }

    location /api/ {
        proxy_pass http://aikova_crm_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # Marketing deep links: serve static artefacts (readable without SPA/iframe JS).
    # Fixes Claude/ChatGPT "blank page" on shared URLs.
    location = /portfolio {
        try_files /portfolio-os/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /portfolio/ {
        try_files /portfolio-os/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /services {
        try_files /aikova-comprehensive-services.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /solutions {
        try_files /solutions-playbook/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /industries {
        try_files /industries-serve/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /contact {
        try_files /aikova-ai-receptionist-contact.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Artefacts + SPA shell must not stick in browser/CDN cache after deploys
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    location / {
        if ($aikova_static_bot = 1) {
            # Home for bots → hero artefact (has readable compiled content when JS runs;
            # still better than empty SPA shell for some fetchers)
            rewrite ^/$ /aikova-flowless-tech-hero.html last;
        }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
