<script>
(function () {
  var routes = {
    'Solutions': '/solutions',
    'Portfolio': '/portfolio',
    'Services': '/services',
    'Industrial Map': '/industries',
    'View Industrial Portfolio': '/portfolio',

    'OS \u00b7 Engineering Vault': '/os'

  function go(path) {
    try {
      if (window.top && window.top !== window) window.top.location.assign(path);
      else window.location.assign(path);
    } catch (err) {
      window.location.assign(path);
    }

  function normalize(s) {

  }
  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('a,button,[role="link"]') : null;

      e.stopPropagation();
      go(routes[label]);
      return;
    }

    if (href.indexOf('mailto:') === 0) return;
